{%- assign tw = site.data.tumbleweed -%}
<div class="tumbleweed" aria-hidden="true"
     data-last-story="{{ include.last_story | date: '%s' }}"
     data-months="{{ tw.months | default: 3 }}"
     data-size-min="{{ tw.size_min | default: 100 }}"
     data-size-max="{{ tw.size_max | default: 160 }}"
     data-speed-min="{{ tw.speed_min | default: 16 }}"
     data-speed-max="{{ tw.speed_max | default: 26 }}"
     data-gap-min="{{ tw.gap_min | default: 15 }}"
     data-gap-max="{{ tw.gap_max | default: 45 }}"
     data-density="{{ tw.density | default: 26 }}">
  <div class="tumbleweed__spin">
    <svg viewBox="0 0 100 100" width="100%" height="100%" fill="none"
         stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="1.15" opacity="0.92"/>
      <path stroke-width="0.80" opacity="0.78"/>
      <path stroke-width="0.50" opacity="0.62"/>
    </svg>
  </div>
  <span class="tumbleweed__shadow"></span>
</div>

<script>
(function () {
  var el = document.querySelector('.tumbleweed');
  if (!el) return;

  /* Add #tumbleweed to the URL to preview it right away while tuning. */
  var preview = location.hash === '#tumbleweed';

  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    el.remove();
    return;
  }

  function num(name, fallback) {
    var v = parseFloat(el.getAttribute('data-' + name));
    return isNaN(v) ? fallback : v;
  }

  /* Only roll out when the newest story is older than N months. */
  if (!preview) {
    var last   = parseInt(el.getAttribute('data-last-story'), 10);
    var cutoff = new Date();
    cutoff.setMonth(cutoff.getMonth() - num('months', 3));
    if (!last || last * 1000 > cutoff.getTime()) {
      el.remove();
      return;
    }
  }

  function rnd(min, max) { return Math.random() * (max - min) + min; }

  /* ── Growing a tumbleweed ────────────────────────────────────────
     A weed is a pile of stem loops: each one is a wobbly closed ring,
     tilted and foreshortened so it reads as a hoop lying at some angle
     in a 3-D ball, and centred off to one side so the pile never looks
     concentric. Loop radii are weighted small, which packs the middle.
     Each loop lands in one of three stroke weights, and a handful of
     stragglers poke out past the edge to keep the silhouette ragged.
     Redrawn from scratch on every roll — no two are the same weed.  */

  var paths = el.querySelectorAll('.tumbleweed__spin path');

  function xy(x, y) {
    return Math.min(Math.max(x, 1), 99).toFixed(1) + ' ' +
           Math.min(Math.max(y, 1), 99).toFixed(1);
  }

  function growWeed() {
    var tiers = [[], [], []];
    var loops = Math.max(8, Math.round(num('density', 26) + rnd(-5, 5)));
    var i, k;

    for (k = 0; k < loops; k++) {
      var cx = 50 + rnd(-15, 15), cy = 50 + rnd(-15, 15);
      var rad = 8 + 34 * Math.pow(Math.random(), 0.75);
      var tilt = rnd(0, Math.PI), squash = rnd(0.45, 1);
      var a0 = rnd(0, Math.PI * 2), n = 16, pts = [];

      for (i = 0; i <= n; i++) {
        var a = a0 + 2 * Math.PI * i / n, r = rad * rnd(0.90, 1.08);
        var px = r * Math.cos(a), py = r * Math.sin(a) * squash;
        pts.push([cx + px * Math.cos(tilt) - py * Math.sin(tilt),
                  cy + px * Math.sin(tilt) + py * Math.cos(tilt)]);
      }

      var d = 'M' + xy(pts[0][0], pts[0][1]);
      for (i = 1; i < pts.length; i++) {
        d += ' Q' + xy((pts[i - 1][0] + pts[i][0]) / 2 + rnd(-1.6, 1.6),
                       (pts[i - 1][1] + pts[i][1]) / 2 + rnd(-1.6, 1.6)) +
             ' ' + xy(pts[i][0], pts[i][1]);
      }
      tiers[[0, 1, 1, 2, 2][Math.floor(Math.random() * 5)]].push(d);
    }

    for (k = 0; k < 14; k++) {
      var sa = rnd(0, Math.PI * 2), sr = rnd(30, 42);
      var x = 50 + sr * Math.cos(sa), y = 50 + sr * Math.sin(sa) * 0.95;
      var len = rnd(4, 11), ang = sa + rnd(-0.7, 0.7);
      var nx = x + len * Math.cos(ang), ny = y + len * Math.sin(ang);
      var bow = rnd(-0.3, 0.3);
      tiers[2].push('M' + xy(x, y) +
        ' Q' + xy((x + nx) / 2 - (ny - y) * bow, (y + ny) / 2 + (nx - x) * bow) +
        ' ' + xy(nx, ny));
    }

    for (i = 0; i < paths.length; i++) paths[i].setAttribute('d', tiers[i].join(' '));
  }

  /* Speeds are authored against a desktop-width window. Below, both the
     size and the duration are scaled to the actual viewport, so the weed
     keeps the same pace in pixels per second and the same share of the
     screen instead of crawling across a phone. */
  var REFERENCE_WIDTH = 1440;

  function roll() {
    growWeed();
    var ltr    = Math.random() < 0.5;
    var vw     = window.innerWidth;
    var travel = vw * 1.35;

    /* Never let it take over a narrow screen. */
    var size = Math.min(rnd(num('size-min', 100), num('size-max', 160)), vw * 0.34);
    var dur  = rnd(num('speed-min', 16), num('speed-max', 26)) * (vw / REFERENCE_WIDTH);

    /* Spin to match the distance covered, so it rolls instead of sliding.
       0.92 leaves a touch of slip, which reads as loose ground. */
    var turns = travel / (Math.PI * size) * 0.92;

    el.style.setProperty('--tw-size', size.toFixed(0) + 'px');
    el.style.setProperty('--tw-dur',  dur.toFixed(1) + 's');
    el.style.setProperty('--tw-spin', ((ltr ? 1 : -1) * turns * 360).toFixed(0) + 'deg');
    /* One cycle = two hops, covering ~2.2 of its own width, so the bounce
       rhythm keeps pace with however fast it is crossing. */
    el.style.setProperty('--tw-hop',  (dur * (size * 2.2) / travel).toFixed(2) + 's');
    /* How high it gets off the ground, as a share of its own height. */
    el.style.setProperty('--tw-lift', '-' + rnd(9, 16).toFixed(1) + '%');
    el.classList.add(ltr ? 'is-ltr' : 'is-rtl');
  }

  function stop() {
    el.classList.remove('is-ltr', 'is-rtl');
    setTimeout(roll, rnd(num('gap-min', 15), num('gap-max', 45)) * 1000);
  }

  el.addEventListener('animationend', function (e) {
    if (e.animationName === 'tumbleRight' || e.animationName === 'tumbleLeft') stop();
  });

  document.addEventListener('visibilitychange', function () {
    el.classList.toggle('is-paused', document.hidden);
  });

  if (preview) { roll(); }
  else { setTimeout(roll, rnd(3000, 9000)); }
}());
</script>
