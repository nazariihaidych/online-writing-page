callout: "Для тих, хто дуже поспішає, але все ж хоче вихопити цікаву та корисну інформацію, її я виділив жовтим кольором."

sections:
  - title: Про проєкт та інші думки
    content: |
      Варто, напевно, почати з легкої передісторії, <span class="yellow-text">як ідея даної сторінки зʼявилася</span>, та інші роздуми про реалізацію і деталі.

      В електронному записнику справ та обовʼязків було зазначене завдання з поміткою «важливо». Xоча в цілому не таке уже й нагальне воно було, але хотілося його виконати, бо був в тому я зацікавлений. 
      А звучало воно так — <span class="yellow-text">«Розібрати, відсортувати, повидаляти, перечитати, подумати над, — всі нотатки, записи, нариси, слова, що стосуються письма у всіх додатках, файлах, розширеннях, за покликаннями та все інше. Зібрати все в одному місці, щось дописати, над чимось попрацювати.»</span>

      Оного вечора робота почалася. Без чаю, без кави, то було літо, було спекотно. Справа та затягнулася на кілька вечорів. Все знайти, нічого не забути, заглянути в кожен електронний куточок, все перечитати, відсортувати та підписати. Я почав із найдавніших записів, які вже пилом покрились, якщо б у фізичній формі були та десь на полиці лежали. Було доволі весело читати свої перші потуги та посміхатися з поривань і наївності. З назви файлу, яка складалася зі слова "Книга" і відповідно її назва, а в середині всього лише сторінка-півтори тексту великим розміром шрифту. Але все те я зберігав в однаковому форматі, в одному місці, як історію та можливо ідею, абощо. Бо, звісно, написано, те було дуже погано і ні про що, з декількох рядків тексту. Та з тих слів можна було вихопити якусь ідею, закинути наживку на добре подумати і, можливо, пізніше розвинути уже в той раніше задуманий, але оновлений проєкт. Читаючи-перечитуючи все, я діяв наступним чином — якщо в рядку, абзаці чи більшому тексті знаходились декілька слів, які разом формували цікаву думку, яка заставляє замислитися, зупинитися на тому місці — я залишав той текст, маркував його датою та іншими атрибутами і знаходив йому місце.

      Так я працював, допоки не перебрав усе, куди тільки мав доступ, і, здається, ні про що не забув. <span class="yellow-text">А тоді, коли я мав перед собою розгалужене дерево з тек та файлів, картина склалася в щось ціле. Виявилося, що за весь період, який я зміг віднайти на своїх електронних приладах, назбиралося доволі багато різного роду і якості текстів.</span> Між них чимало таких, які тільки дещо підкрути та розкрути, підредагуй і готова страва до читання. Коротких, на декілька рядків, але з правом на життя, і дещо довших, які просили більше уваги, але і розказували куди цікавішу та насиченішу історію. Тому одного вечора я загорівся ідеєю, що варто щось із цим зробити. Винести на публіку, стерти пил та надати якоїсь цінності.

      Паралельно з тими справами та іншими подіями в моєму житті, я вже досить давно використовував для власних потреб <span class="yellow-text">програмне забезпечення Notion</span>. Вів там деякі нотатки та інші проєкти. На даній платформі була можливість публікувати сторінки, робити їх доступними для загалу одним тільки кліком. І це було саме те що потрібно. Мінімум підтримки і миттєва публікація. <span class="yellow-text">Це була перша версія і вийшла вона саме так як я те задумав</span>. Жила дана веб-сторінка доволі довго, хоч і не застала багато публікацій і відвідувань.

      Згодом я випадково натрапив на цікавий блог, подосліджував його, походив сторінками і зацікавився як воно зроблено. Так я відкрив для себе <span class="yellow-text">Jekyll - генератор статичних веб-сайтів</span>. Я завжди хотів переїхати на щось своє, щоб контролювати те і се, і налаштовувати все за своїм бажанням. Тож полиставши документацію, переглянув декілька відео та прикладів - вирішив що це воно, найкраща заміна. Просто, без лишньої складності і налаштовуй як собі того хочеш.

      Процес пішов. Все закрутилося, зашуміло і поїхало.

      І ось те, що ви бачите, це те, як воно є, як воно вийшло. <span class="yellow-text">Моя ідея, мій проєкт та тексти.</span> Звісно, не ідеально, але уже як вийшло. І також варто сказати, що весь процес підготовки, всі дрібнички, проведена робота, дали приємний поштовх і натхнення. Не зважаючи на масу згрупованих файлів, зʼявилися нові. Нові ідеї та нові твори.

      Дякую за увагу! Читайте, досліджуйте! Надихайтеся та працюйте над бажаним! Зустрінемося в наступних розділах.


  - title: Про кнопки та як все працює
    content: |
      Загалом все просто. На основній сторінці розміщена галерея з опублікованими текстами, вибирайте та читайте.

      <span class="yellow-text">Кожна історія має свої атрибути, які на початку сторінки можна побачити. Якщо історія має продовження, ще одну або декілька частин, то в дію підключається атрибут "Частина з " і відповідне значення — назва, яка обʼєднує їх. Також у такому випадку на початку сторінки є кнопка, що приведе вас до попередньої частини, а в низу попередньої на наступну.</span>

      <span class="yellow-text">Кнопка сонечка або місяця змінює тему, щоб вечірком було легше читати. А також деякі історії мають свої особливі ефекти, щоб краще перенести вас в ті чи інші описані події та пригоди, але якщо вам від того робиться зле, захитує, або ж просто не зовсім зручо читати, то шукайту кнопочку в правому нижньому куті, щоб вимкнути ефект.</span>

      Все відсортовано за датою додавання.

      <span class="yellow-text">Якщо ж ви завітали зі смартфона, то, щоб дістатися до інших сторінок, тапайте три рисочки у верхньому правому куті.</span>

      Здається, це все. Як я й сказав — доволі просто, але таки вирішив деякі моменти уточнити.

  - title: Що далі, бачення та можливі розвитки подій
    content: |
      <span class="yellow-text">Далі я буду писати.</span> Редагувати давно написані тексти, які маю бажання тут поширити. <span class="yellow-text">Писати нові</span>, створювати під них цікаві цифрові картини. Розсилати сповіщення про нові публікації. Якось <span class="yellow-text">підтримувати життя цього проєкту.</span>

      Але також в мене є ще одне цікаве на те бачення. Можливо, <span class="yellow-text">знайдуться зацікавлені люди, які будуть мати бажання разом попрацювати</span>, в яких теж завалялися тексти, які хочуть жити, хочуть щоб їх читали. А також разом щось написати. Тоді вже дзвінки, зустрічі, чаювання і всяке таке. Спільний чат звісно. <span class="yellow-text">Така собі літературна майстерня на мінімалках.</span> У такому випадку я б змінив Про мене на Про авторів, а також вступне слово. Тоді це було б уже дещо спільна праця.

  - title: Сповіщення та коментарі
    content: |
      [**Telegram**<span class="yellow-text">@online_writing_page</span>](https://t.me/online_writing_page){: .yellow-link}

      [**Instagram**<span class="yellow-text">@online_writing_page</span>](https://www.instagram.com/online_writing_page?igsh=bDh2MjJhZ3dvM282&utm_source=qr){: .yellow-link}

      ---

      <span class="yellow-text">За активністю на сторінці можна стежити двома способами: підписатися на [Telegram-канал](https://t.me/online_writing_page){: .yellow-link} або на [сторінку в Instagram](https://www.instagram.com/online_writing_page?igsh=bDh2MjJhZ3dvM282&utm_source=qr){: .yellow-link}.</span>

      <span class="yellow-text">Щодо періодичності публікацій, тут точних часових рамок встановити не зможу. Все залежить від вільного часу, якого зараз, на жаль вкрай мало.</span>

      На двох платформах, що каналі, що Інстаграм сторінці буде приблизно однакова інформація. Залежно тільки від того як вам зручніше, на такий ресурс і підписуйтеся. А можна і на двох платформах одночасно.

      <span class="yellow-text">У соціальних мережах будуть висвітлені анонси, новини та будь-які зміни, а також основне — це те, що новий текст додано.</span>

      <span class="yellow-text">Щодо коментарів</span> на Онлайн сторінці письма — наразі немає такої можливості. Тому якщо маєте бажання висловити думку щодо тексту чи епізоду, або обговори незрозумілі моменти, <span class="yellow-text">запрошую до секції коментарів у соціальних мережах. Не соромтеся, пишіть всякого та будемо спілкуватися.</span>

  - title: Подяки
    content: |
      <div class="callout callout--outline">
      <h4 class="yellow-text" style="margin: 0 0 0.5rem;">Аліні Савʼюк</h4>

      Дуже велике дякую моїй коханій людині і за сумісництвом філологині та редакторці всіх текстів. Моїй альфа- та бета-читачці. За постійну підтримку, віру та щоденну мотивацію. Дякую, що читаєш, підказуєш та стараєшся зробити мою працю кращою.
      </div>

